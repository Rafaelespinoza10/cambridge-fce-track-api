service: cambridge-tracker-auth
frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  region: ${file(serverless.env.yml):${opt:stage, 'dev'}.REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--enable-source-maps --stack-trace-limit=1000'

functions: ${file(src/services/auth.serverless.yml):functions}

package:
  individually: true
  patterns:
    - '!README.md'
    - '!docs/**'
    - '!.env*'
    - '!coverage/**'
    - '!tsconfig*.json'
    - '!.prettierrc.json'
    - '!.prettierignore'
    - '!deploy.sh'
    - '!deploy.ps1'
    - '!serverless.ts.scaffold'
    - '!src/functions/**'

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - 'aws-sdk'
    target: 'node20'
    platform: node
    concurrency: 10
