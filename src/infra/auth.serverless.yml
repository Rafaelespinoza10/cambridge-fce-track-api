service: cambridge-tracker-auth
frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${file(serverless.env.yml):${opt:stage, 'dev'}.REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--stack-trace-limit=1000'
    DATABASE_URL: ${file(serverless.env.yml):${opt:stage, 'dev'}.DATABASE_URL}
    JWT_SECRET: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_SECRET}
    JWT_EXPIRES_IN: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_EXPIRES_IN}

functions:
  register:
    handler: src/controllers/authController.register
    events:
      - httpApi:
          path: /auth/register
          method: POST

  login:
    handler: src/controllers/authController.login
    events:
      - httpApi:
          path: /auth/login
          method: POST

  me:
    handler: src/controllers/authController.me
    events:
      - httpApi:
          path: /auth/me
          method: GET

package:
  individually: true

custom:
  esbuild: ${file(main.serverless.yml):custom.esbuild}
