service: cambridge-tracker-mocks
frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${file(serverless.env.yml):${opt:stage, 'dev'}.REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--stack-trace-limit=1000'
    DATABASE_URL: ${file(serverless.env.yml):${opt:stage, 'dev'}.DATABASE_URL}
    JWT_SECRET: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_SECRET}
    JWT_EXPIRES_IN: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_EXPIRES_IN}
    OPEN_AI_API_KEY: ${file(serverless.env.yml):${opt:stage, 'dev'}.OPEN_AI_API_KEY}
    OPENAI_MODEL: ${file(serverless.env.yml):${opt:stage, 'dev'}.OPENAI_MODEL, ''}
    OPENAI_EMBEDDING_MODEL: ${file(serverless.env.yml):${opt:stage, 'dev'}.OPENAI_EMBEDDING_MODEL, ''}

functions:
  mocksSectionCatalog:
    handler: src/controllers/mocksController.getMockSectionCatalog
    events:
      - httpApi:
          path: /mocks/catalog/{examType}/sections
          method: GET

  mocksCreate:
    handler: src/controllers/mocksController.createMock
    events:
      - httpApi:
          path: /mocks
          method: POST

  mocksList:
    handler: src/controllers/mocksController.listMocks
    events:
      - httpApi:
          path: /mocks
          method: GET

  mocksExport:
    handler: src/controllers/mocksController.exportMocks
    events:
      - httpApi:
          path: /mocks/export
          method: GET

  mocksGet:
    handler: src/controllers/mocksController.getMock
    events:
      - httpApi:
          path: /mocks/{mockId}
          method: GET

  mocksUpdate:
    handler: src/controllers/mocksController.updateMock
    events:
      - httpApi:
          path: /mocks/{mockId}
          method: PATCH

  mocksDelete:
    handler: src/controllers/mocksController.deleteMock
    events:
      - httpApi:
          path: /mocks/{mockId}
          method: DELETE

  mocksImport:
    handler: src/controllers/mocksController.importMocks
    events:
      - httpApi:
          path: /mocks/import
          method: POST

  # ── Full timed mock attempts (live-taking, AI-generated + curated content) ──
  # Section content is generated lazily, one section at a time (never all 13
  # up front) — see StartMockAttemptSectionService's doc comment for why:
  # bulk LLM work in one Lambda invocation risks the ~29s httpApi hard
  # timeout this codebase already documents for the Cambridge Knowledge Base
  # import endpoint. mockAttemptsStartSection/mockAttemptsSubmitSection get a
  # longer function timeout for the one section that can call the LLM
  # (writing) or search the Knowledge Base (grounded Reading generation).

  mockAttemptsStart:
    handler: src/controllers/mockAttemptsController.startMockAttempt
    events:
      - httpApi:
          path: /mocks/attempts
          method: POST

  mockAttemptsGetActive:
    handler: src/controllers/mockAttemptsController.getActiveMockAttempt
    events:
      - httpApi:
          path: /mocks/attempts/active
          method: GET

  mockAttemptsGet:
    handler: src/controllers/mockAttemptsController.getMockAttempt
    events:
      - httpApi:
          path: /mocks/attempts/{attemptId}
          method: GET

  mockAttemptsStartSection:
    handler: src/controllers/mockAttemptsController.startMockAttemptSection
    timeout: 29
    events:
      - httpApi:
          path: /mocks/attempts/{attemptId}/sections/{sectionCode}/start
          method: POST

  mockAttemptsSubmitSection:
    handler: src/controllers/mockAttemptsController.submitMockAttemptSection
    timeout: 29
    events:
      - httpApi:
          path: /mocks/attempts/{attemptId}/sections/{sectionCode}/submit
          method: POST

  # Re-serves an already-submitted section's grading result — submitting a
  # section returns it once, transiently, so a client that reloads before
  # acknowledging the result screen would otherwise lose it. DB-only, no
  # explicit timeout needed.
  mockAttemptsGetSectionResult:
    handler: src/controllers/mockAttemptsController.getMockAttemptSectionResult
    events:
      - httpApi:
          path: /mocks/attempts/{attemptId}/sections/{sectionCode}
          method: GET

  mockAttemptsSubmit:
    handler: src/controllers/mockAttemptsController.submitMockAttempt
    events:
      - httpApi:
          path: /mocks/attempts/{attemptId}/submit
          method: POST

  mockAttemptsAbandon:
    handler: src/controllers/mockAttemptsController.abandonMockAttempt
    events:
      - httpApi:
          path: /mocks/attempts/{attemptId}/abandon
          method: POST

package:
  individually: true

custom:
  esbuild: ${file(main.serverless.yml):custom.esbuild}
