service: cambridge-tracker-planning
frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${file(serverless.env.yml):${opt:stage, 'dev'}.REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--stack-trace-limit=1000'
    DATABASE_URL: ${file(serverless.env.yml):${opt:stage, 'dev'}.DATABASE_URL}
    JWT_SECRET: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_SECRET}
    JWT_EXPIRES_IN: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_EXPIRES_IN}

functions:
  planningCreateWeekPlan:
    handler: src/controllers/planningController.createWeekPlan
    events:
      - httpApi:
          path: /plans/weeks
          method: POST

  planningGetCurrentPlan:
    handler: src/controllers/planningController.getCurrentPlan
    events:
      - httpApi:
          path: /plans/current
          method: GET

  planningGetWeekPlan:
    handler: src/controllers/planningController.getWeekPlan
    events:
      - httpApi:
          path: /plans/weeks/{weekId}
          method: GET

  planningAddActivity:
    handler: src/controllers/planningController.addActivity
    events:
      - httpApi:
          path: /plans/weeks/{weekId}/days/{dayId}/activities
          method: POST

  planningUpdateActivity:
    handler: src/controllers/planningController.updateActivity
    events:
      - httpApi:
          path: /plans/activities/{plannedActivityId}
          method: PATCH

  planningDeleteActivity:
    handler: src/controllers/planningController.deleteActivity
    events:
      - httpApi:
          path: /plans/activities/{plannedActivityId}
          method: DELETE

  planningMoveActivity:
    handler: src/controllers/planningController.moveActivity
    events:
      - httpApi:
          path: /plans/activities/{plannedActivityId}/move
          method: PATCH

  planningGetActivityHistory:
    handler: src/controllers/planningController.getActivityHistory
    events:
      - httpApi:
          path: /plans/activities
          method: GET

package:
  individually: true

custom:
  esbuild: ${file(main.serverless.yml):custom.esbuild}
