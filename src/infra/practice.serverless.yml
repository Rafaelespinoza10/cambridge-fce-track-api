service: cambridge-tracker-practice
frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${file(serverless.env.yml):${opt:stage, 'dev'}.REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--stack-trace-limit=1000'
    DATABASE_URL: ${file(serverless.env.yml):${opt:stage, 'dev'}.DATABASE_URL}
    JWT_SECRET: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_SECRET}
    JWT_EXPIRES_IN: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_EXPIRES_IN}
    OPEN_AI_API_KEY: ${file(serverless.env.yml):${opt:stage, 'dev'}.OPEN_AI_API_KEY}
    OPENAI_MODEL: ${file(serverless.env.yml):${opt:stage, 'dev'}.OPENAI_MODEL, ''}

functions:
  practiceGenerateExercise:
    handler: src/controllers/practiceExerciseController.generatePracticeExercise
    timeout: 29
    events:
      - httpApi:
          path: /practice/exercises
          method: POST

  practiceGetExercise:
    handler: src/controllers/practiceExerciseController.getPracticeExercise
    events:
      - httpApi:
          path: /practice/exercises/{exerciseId}
          method: GET

package:
  individually: true

custom:
  esbuild: ${file(main.serverless.yml):custom.esbuild}
