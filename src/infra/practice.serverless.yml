service: cambridge-tracker-practice
frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${file(serverless.env.yml):${opt:stage, 'dev'}.REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--stack-trace-limit=1000'
    DATABASE_URL: ${file(serverless.env.yml):${opt:stage, 'dev'}.DATABASE_URL}
    JWT_SECRET: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_SECRET}
    JWT_EXPIRES_IN: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_EXPIRES_IN}
    OPEN_AI_API_KEY: ${file(serverless.env.yml):${opt:stage, 'dev'}.OPEN_AI_API_KEY}
    OPENAI_MODEL: ${file(serverless.env.yml):${opt:stage, 'dev'}.OPENAI_MODEL, ''}

functions:
  practiceGenerateExercise:
    handler: src/controllers/practiceExerciseController.generatePracticeExercise
    timeout: 29
    events:
      - httpApi:
          path: /practice/exercises
          method: POST

  practiceGetExercise:
    handler: src/controllers/practiceExerciseController.getPracticeExercise
    events:
      - httpApi:
          path: /practice/exercises/{exerciseId}
          method: GET

  practiceStartAttempt:
    handler: src/controllers/practiceAttemptController.startPracticeAttempt
    events:
      - httpApi:
          path: /practice/exercises/{exerciseId}/attempts
          method: POST

  practiceListAttemptHistory:
    handler: src/controllers/practiceAttemptController.listPracticeAttemptHistory
    events:
      - httpApi:
          path: /practice/attempts
          method: GET

  practiceGetActiveAttempt:
    handler: src/controllers/practiceAttemptController.getActivePracticeAttempt
    events:
      - httpApi:
          path: /practice/attempts/active
          method: GET

  practiceGetAttempt:
    handler: src/controllers/practiceAttemptController.getPracticeAttempt
    events:
      - httpApi:
          path: /practice/attempts/{attemptId}
          method: GET

  practiceSubmitAttempt:
    handler: src/controllers/practiceAttemptController.submitPracticeAttempt
    events:
      - httpApi:
          path: /practice/attempts/{attemptId}/submit
          method: POST

  practiceAbandonAttempt:
    handler: src/controllers/practiceAttemptController.abandonPracticeAttempt
    events:
      - httpApi:
          path: /practice/attempts/{attemptId}/abandon
          method: POST

  # Short key: AWS Lambda names are {service}-{stage}-{key} and must be ≤ 64 chars.
  practiceErrorFcDraft:
    handler: src/controllers/practiceAttemptController.generatePracticeErrorFlashcardDraft
    timeout: 25
    events:
      - httpApi:
          path: /practice/attempts/{attemptId}/items/{itemId}/flashcard-draft
          method: POST

  practiceInsights:
    handler: src/controllers/practiceAdaptiveController.getPracticeInsights
    events:
      - httpApi:
          path: /practice/insights
          method: GET

  practiceRecommendations:
    handler: src/controllers/practiceAdaptiveController.postPracticeRecommendations
    timeout: 29
    events:
      - httpApi:
          path: /practice/recommendations
          method: POST

package:
  individually: true

custom:
  esbuild: ${file(main.serverless.yml):custom.esbuild}
