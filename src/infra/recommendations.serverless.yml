service: cambridge-tracker-recommendations
frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${file(serverless.env.yml):${opt:stage, 'dev'}.REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--stack-trace-limit=1000'
    DATABASE_URL: ${file(serverless.env.yml):${opt:stage, 'dev'}.DATABASE_URL}
    JWT_SECRET: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_SECRET}
    JWT_EXPIRES_IN: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_EXPIRES_IN}

functions:
  recommendationsGet:
    handler: src/controllers/recommendationsController.getRecommendations
    events:
      - httpApi:
          path: /recommendations
          method: GET

  recommendationsGenerate:
    handler: src/controllers/recommendationsController.generateRecommendations
    events:
      - httpApi:
          path: /recommendations/generate
          method: POST

  recommendationsUpdate:
    handler: src/controllers/recommendationsController.updateRecommendation
    events:
      - httpApi:
          path: /recommendations/{recommendationId}
          method: PATCH

  recommendationsDelete:
    handler: src/controllers/recommendationsController.deleteRecommendation
    events:
      - httpApi:
          path: /recommendations/{recommendationId}
          method: DELETE

package:
  individually: true

custom:
  esbuild: ${file(main.serverless.yml):custom.esbuild}
