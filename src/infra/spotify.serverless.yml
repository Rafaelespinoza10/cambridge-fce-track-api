service: cambridge-tracker-spotify
frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${file(serverless.env.yml):${opt:stage, 'dev'}.REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--enable-source-maps --stack-trace-limit=1000'
    DATABASE_URL: ${file(serverless.env.yml):${opt:stage, 'dev'}.DATABASE_URL}
    JWT_SECRET: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_SECRET}
    JWT_EXPIRES_IN: ${file(serverless.env.yml):${opt:stage, 'dev'}.JWT_EXPIRES_IN}
    # TEMPORARILY COMMENTED OUT — bootstrap deploy only.
    #
    # SPOTIFY_REDIRECT_URI has to be this service's own deployed callback URL,
    # registered verbatim in the Spotify dashboard. That URL doesn't exist
    # until the service is deployed, so the first deploy goes out with these
    # unset and only spotifyHealth wired up, purely to mint the API Gateway
    # URL. Every other function in this service will throw until they're back.
    #
    # TO RESTORE: uncomment all five, fill the real values into
    # serverless.env.yml, delete the spotifyHealth function below and
    # src/controllers/spotifyHealthController.ts, then redeploy. Env vars are
    # baked into the Lambda at deploy time, so a redeploy is required.
    #
    # SPOTIFY_CLIENT_ID: ${file(serverless.env.yml):${opt:stage, 'dev'}.SPOTIFY_CLIENT_ID}
    # SPOTIFY_CLIENT_SECRET: ${file(serverless.env.yml):${opt:stage, 'dev'}.SPOTIFY_CLIENT_SECRET}
    # SPOTIFY_REDIRECT_URI: ${file(serverless.env.yml):${opt:stage, 'dev'}.SPOTIFY_REDIRECT_URI}
    # SPOTIFY_TOKEN_ENCRYPTION_KEY: ${file(serverless.env.yml):${opt:stage, 'dev'}.SPOTIFY_TOKEN_ENCRYPTION_KEY}
    # FRONTEND_APP_URL: ${file(serverless.env.yml):${opt:stage, 'dev'}.FRONTEND_APP_URL}

functions:
  # TEMPORARY — remove together with the commented env vars above.
  spotifyHealth:
    handler: src/controllers/spotifyHealthController.health
    events:
      - httpApi:
          path: /spotify/health
          method: GET

  spotifyConnect:
    handler: src/controllers/spotifyController.connect
    events:
      - httpApi:
          path: /spotify/connect
          method: GET

  spotifyCallback:
    handler: src/controllers/spotifyController.callback
    events:
      - httpApi:
          path: /spotify/callback
          method: GET

  spotifyStatus:
    handler: src/controllers/spotifyController.status
    events:
      - httpApi:
          path: /spotify/status
          method: GET

  spotifyDisconnect:
    handler: src/controllers/spotifyController.disconnect
    events:
      - httpApi:
          path: /spotify/connection
          method: DELETE

  spotifyListPlaylists:
    handler: src/controllers/spotifyController.listPlaylists
    events:
      - httpApi:
          path: /spotify/playlists
          method: GET

  spotifyListShows:
    handler: src/controllers/spotifyController.listShows
    events:
      - httpApi:
          path: /spotify/shows
          method: GET

  spotifyImportItem:
    handler: src/controllers/spotifyController.importItem
    events:
      - httpApi:
          path: /spotify/import
          method: POST

package:
  individually: true

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - 'aws-sdk'
    target: 'node22'
    platform: node
    concurrency: 10
